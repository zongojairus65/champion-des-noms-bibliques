name: apk
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier la clé de signature
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Clé de signature absente. Lance d'abord : bash scripts/creer-cle.sh"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npx cap add android
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Icône et écran de démarrage
        run: |
          pip install --quiet pillow
          python3 scripts/make-android-assets.py
      - run: npx cap sync android
      - name: Numéro de version (augmente à chaque construction)
        run: |
          N=${{ github.run_number }}
          sed -i -E "s/versionCode [0-9]+/versionCode $N/; s/versionName \"[^\"]*\"/versionName \"1.0.$N\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle
          grep -q "versionCode $N" android/app/build.gradle
      - name: Construire l'APK de vente
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease
      - name: Aligner et signer
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/cle.jks"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          IN=android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$BT/zipalign" -p -f 4 "$IN" aligned.apk
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/cle.jks" --ks-pass env:KS_PASS --key-pass env:KEY_PASS --ks-key-alias "$KEY_ALIAS" --out champion-des-noms-bibliques.apk aligned.apk
          "$BT/apksigner" verify --print-certs champion-des-noms-bibliques.apk
          rm -f "$RUNNER_TEMP/cle.jks" aligned.apk
      - name: Publier l'APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest champion-des-noms-bibliques.apk --title "Champion des noms bibliques (APK signée)" --notes "Version 1.0.${{ github.run_number }}"
