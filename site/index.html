<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Champion des noms bibliques</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(#e9a94b,#b9772a);font-family:system-ui,sans-serif;color:#fff;text-align:center;touch-action:none;user-select:none;-webkit-user-select:none}
h1{margin:12px 0 2px;font-size:19px;text-shadow:0 2px 0 #7a4a12}
#lvl{display:inline-block;margin:4px 0;padding:4px 16px;border-radius:14px;background:#7a4a12;font-weight:800}
#grid{margin:8px auto;padding:10px;max-width:380px;background:#3a5db0;border:5px solid #dbe8ff;border-radius:18px;display:flex;flex-wrap:wrap;justify-content:center;gap:6px 14px}
.word{display:flex;gap:3px}
.cell{width:26px;height:26px;border-radius:5px;background:#27407d;font-weight:800;font-size:16px;line-height:26px;color:#fff}
.cell.on{background:#ffe9c4;color:#c2661a;border:2px solid #f0a64b;line-height:22px}
#wheelwrap{position:relative;width:290px;height:290px;margin:6px auto;background:#2b2118;border:4px dashed #f1d9a8;border-radius:50px}
svg{position:absolute;inset:0;pointer-events:none}
.let{position:absolute;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;font-size:34px;font-weight:900;line-height:56px;color:#f7a23a}
.let.sel{background:#f7a23a;color:#2b2118}
#cur{height:32px;font-size:26px;font-weight:900;letter-spacing:3px}
button{font-size:15px;padding:9px 20px;border:0;border-radius:20px;background:#fff;color:#7a4a12;font-weight:800}
#win{display:none;margin:8px 16px}
#win div{font-size:20px;font-weight:900;background:#2e8b3d;padding:10px;border-radius:14px;margin-bottom:8px}
.shake{animation:s .3s}@keyframes s{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
</style></head><body>
<h1>🏆 Champion des noms bibliques</h1><div id="lvl"></div>
<div id="grid"></div>
<div id="cur"></div>
<div id="wheelwrap"><svg width="290" height="290"><polyline id="line" fill="none" stroke="#b44bff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
<button id="shuf">🔀 Mélanger</button>
<div id="win"><div>🎉 Bravo ! Niveau réussi !</div><button id="next">Niveau suivant ▶</button></div>
<script>
let LV=[],n=1,L,path=[],found=new Set(),drag=false;
const $=id=>document.getElementById(id);
const sget=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const sset=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
fetch('levels.json').then(r=>r.json()).then(a=>{LV=a;n=Math.min(Math.max(1,sget('nb-lvl',1)),LV.length);load();});
function load(){L={l:[...LV[n-1].l],w:LV[n-1].w};found=new Set(sget('nb-f-'+n,[]));
 $('lvl').textContent='Niveau '+n+' / '+LV.length;$('win').style.display='none';grid();wheel();check();}
function grid(){$('grid').innerHTML=L.w.map(w=>'<div class="word">'+[...w].map(c=>'<div class="cell'+(found.has(w)?' on':'')+'">'+(found.has(w)?c:'')+'</div>').join('')+'</div>').join('');}
function wheel(){const W=$('wheelwrap');W.querySelectorAll('.let').forEach(e=>e.remove());
 const k=L.l.length;L.l.forEach((c,i)=>{const a=-Math.PI/2+i*2*Math.PI/k,e=document.createElement('div');
 e.className='let';e.textContent=c;e.style.left=(145+100*Math.cos(a))+'px';e.style.top=(145+100*Math.sin(a))+'px';W.appendChild(e);});}
function ctr(e){return [parseFloat(e.style.left),parseFloat(e.style.top)];}
function draw(x,y){const p=path.map(e=>ctr(e).join(','));if(x!=null)p.push(x+','+y);$('line').setAttribute('points',p.join(' '));
 $('cur').textContent=path.map(e=>e.textContent).join('');
 document.querySelectorAll('.let').forEach(e=>e.classList.toggle('sel',path.includes(e)));}
function pos(ev){const r=$('wheelwrap').getBoundingClientRect();return [ev.clientX-r.left,ev.clientY-r.top];}
function hit(ev){const e=document.elementFromPoint(ev.clientX,ev.clientY);return e&&e.classList.contains('let')?e:null;}
$('wheelwrap').addEventListener('pointerdown',ev=>{const e=hit(ev);if(!e)return;drag=true;path=[e];const[x,y]=pos(ev);draw(x,y);});
window.addEventListener('pointermove',ev=>{if(!drag)return;const e=hit(ev);
 if(e){if(path.length>1&&e===path[path.length-2])path.pop();else if(!path.includes(e))path.push(e);}
 const[x,y]=pos(ev);draw(x,y);});
window.addEventListener('pointerup',()=>{if(!drag)return;drag=false;const w=path.map(e=>e.textContent).join('');
 if(L.w.includes(w)&&!found.has(w)){found.add(w);sset('nb-f-'+n,[...found]);grid();check();}
 else if(w.length>1){$('wheelwrap').classList.add('shake');setTimeout(()=>$('wheelwrap').classList.remove('shake'),300);}
 path=[];draw(null);});
$('shuf').onclick=()=>{L.l.sort(()=>Math.random()-.5);wheel();};
$('next').onclick=()=>{if(n<LV.length){n++;sset('nb-lvl',n);load();}else{$('win').firstChild.textContent='🏆 Tu es le champion ! 1000 niveaux terminés !';$('next').style.display='none';}};
function check(){if(L&&found.size===L.w.length)$('win').style.display='block';}
</script></body></html>
