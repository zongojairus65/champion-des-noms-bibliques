<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>Champion des noms bibliques</title>
<style>
:root{--o1:#ffa24d;--o2:#f7842f;--ink:#4a2b16}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;overflow:hidden;font-family:"Trebuchet MS",system-ui,sans-serif;color:#fff;user-select:none;-webkit-user-select:none;touch-action:none;
 background:repeating-linear-gradient(45deg,rgba(255,255,255,.06) 0 2px,transparent 2px 5px),#a89b8d}
#top{flex:0 0 auto;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 22px;
 background:linear-gradient(90deg,rgba(255,255,255,.17) 50%,transparent 50%),linear-gradient(rgba(255,255,255,.17) 50%,transparent 50%),#2a8f96;background-size:34px 34px;
 box-shadow:0 10px 18px rgba(0,0,0,.35)}
#bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.wood{border:0;color:#fff;background:linear-gradient(#e0a361,#9a5d2a);border-radius:14px;box-shadow:inset 0 2px 0 rgba(255,255,255,.45),0 4px 0 #5d3414,0 7px 10px rgba(0,0,0,.4);font-weight:800}
.wood:active{transform:translateY(3px);box-shadow:inset 0 2px 0 rgba(255,255,255,.45),0 1px 0 #5d3414}
#gear{position:relative;width:46px;height:46px;font-size:24px}
.ribbon{position:relative;white-space:nowrap;padding:7px 16px;font-size:17px;font-weight:900;letter-spacing:.5px;text-shadow:0 2px 0 #7d1228;
 background:linear-gradient(#e9506b,#b72240);outline:2px dashed rgba(255,255,255,.75);outline-offset:-5px;box-shadow:0 4px 0 #7d1228,0 8px 10px rgba(0,0,0,.35)}
.ribbon:before,.ribbon:after{content:"";position:absolute;top:7px;width:11px;height:100%;background:linear-gradient(#b82a46,#8f1830)}
.ribbon:before{left:-11px;clip-path:polygon(0 0,100% 0,100% 100%,0 100%,35% 50%)}
.ribbon:after{right:-11px;clip-path:polygon(0 0,100% 0,65% 50%,100% 100%,0 100%)}
#coins,#hcoins{display:flex;align-items:center;gap:6px;padding:4px 4px 4px 4px;border-radius:24px;background:rgba(0,0,0,.28);box-shadow:inset 0 2px 4px rgba(0,0,0,.4)}
.coin{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3a6,#f6b91f 55%,#c47d08);border:2px solid #fff0a0;color:#a15d00;font-weight:900;font-size:15px;box-shadow:0 2px 0 #8a5300}
#coinn,#hcoinn{font-weight:900;font-size:20px;min-width:44px;text-align:center;text-shadow:0 2px 0 rgba(0,0,0,.4)}
#plus,#hplus{width:34px;height:34px;border-radius:50%;border:2px solid #d6ffd0;color:#fff;font-size:26px;line-height:26px;font-weight:900;background:radial-gradient(circle at 35% 30%,#8df06f,#27a521);box-shadow:0 3px 0 #146b10}
#panel{position:relative;background:linear-gradient(#f8efd2,#efe2bd);border-radius:24px;padding:18px 14px 56px;min-height:190px;max-height:36vh;display:flex;align-items:center;justify-content:center;
 box-shadow:0 6px 0 #d8caa6,0 11px 0 rgba(0,0,0,.14),0 18px 22px rgba(0,0,0,.35)}
#panel:before{content:"";position:absolute;inset:9px;border:3px dashed #d3a276;border-radius:17px;pointer-events:none}
#grid{display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:calc(var(--c,40px)*.26) calc(var(--c,40px)*.5);width:100%}
.word{display:flex;gap:calc(var(--c,40px)*.12)}
.cell{width:var(--c);height:var(--c);border-radius:11px;background:linear-gradient(#b9a696,#a89484);box-shadow:inset 0 3px 6px rgba(0,0,0,.3),0 2px 0 rgba(255,255,255,.8)}
.cell.on,.cell.hint{display:grid;place-items:center;font-weight:900;font-size:calc(var(--c)*.64);color:var(--o2);
 background:linear-gradient(#fffdf6,#f3e6c8);border:3px solid #fff;outline:2px solid #9a5a2b;outline-offset:-1px;
 text-shadow:0 2px 0 #fff,0 4px 3px rgba(150,70,10,.45);box-shadow:0 4px 0 #8a5226,0 7px 9px rgba(0,0,0,.35)}
.cell.hint{color:rgba(247,132,47,.5)}
.cell.pop{animation:pop .45s}
@keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
#bottom{flex:1;position:relative;padding-bottom:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0}
#strip{position:absolute;top:-6px;left:22%;width:44%;height:18px;background:repeating-linear-gradient(90deg,#f19a43 0 14px,#fff1dc 14px 28px);transform:rotate(-2deg);box-shadow:0 3px 5px rgba(0,0,0,.3)}
#btn{position:absolute;top:8px;right:14%;width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f3e1c0,#c9ab7d);box-shadow:0 3px 4px rgba(0,0,0,.35)}
#btn:before,#btn:after{content:"";position:absolute;top:11px;width:5px;height:5px;border-radius:50%;background:#7a5d37}
#btn:before{left:9px}#btn:after{right:9px}
#cur{min-height:40px;margin:14px 0 6px;padding:5px 20px;border-radius:22px;font-size:24px;font-weight:900;letter-spacing:4px;visibility:hidden;
 background:linear-gradient(#b06a30,#7d4318);box-shadow:inset 0 2px 0 rgba(255,255,255,.3),0 3px 0 #4a250c,0 6px 8px rgba(0,0,0,.4)}
#wheel{position:relative;width:min(70vw,35vh,300px);aspect-ratio:1;border-radius:30% 27% 31% 28%/28% 31% 27% 30%;
 background:radial-gradient(circle at 50% 35%,#4a2e1d,#2a170c 70%,#1c0e06);
 box-shadow:0 0 0 9px #ddd3c6,0 0 0 11px #b9ad9c,0 16px 26px rgba(0,0,0,.5),inset 0 8px 18px rgba(0,0,0,.65)}
#wheel:before{content:"";position:absolute;inset:11px;border:3px dashed #f0d9b0;border-radius:inherit;pointer-events:none;opacity:.9}
#svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;filter:drop-shadow(0 0 7px #d58bff)}
.let{position:absolute;display:grid;place-items:center;border-radius:50%;font-weight:900;color:var(--o2);
 -webkit-text-stroke:2px #ffe0bd;text-shadow:0 4px 0 #b9541a,0 8px 10px rgba(0,0,0,.6);transition:transform .12s}
.let.sel{background:radial-gradient(circle,rgba(255,255,255,.3),transparent 70%);transform:translate(-50%,-50%) scale(1.14)}
.let{transform:translate(-50%,-50%)}
.act{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);width:84px;text-align:center;font-size:13px;font-weight:800;text-shadow:0 2px 0 rgba(0,0,0,.45)}
.act .wood{display:grid;place-items:center;width:64px;height:64px;margin:0 auto 3px;font-size:30px}
#shuf{left:14px}#hint{right:14px}
.cost{display:inline-flex;align-items:center;gap:3px}
.cost .coin{width:18px;height:18px;font-size:10px}
#ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55);z-index:70;padding:18px}
.card{position:relative;width:100%;max-width:370px;padding:14px;border-radius:22px;background:linear-gradient(#e0a361,#a96a32);box-shadow:0 6px 0 #5d3414,0 16px 30px rgba(0,0,0,.5)}
.paper{position:relative;padding:34px 12px 16px;border-radius:14px;background:linear-gradient(#f8efd2,#efe2bd);color:#7a3d12;text-align:center;box-shadow:inset 0 3px 8px rgba(0,0,0,.2)}
.paper:before{content:"";position:absolute;inset:6px;border:2px dashed #d3a276;border-radius:10px;pointer-events:none}
.card .ribbon{position:absolute;top:-16px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:18px;padding:6px 26px;z-index:2}
.x{position:absolute;top:-10px;right:-8px;width:36px;height:36px;font-size:20px;z-index:3}
.days{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 14px}
.day{padding:4px 2px 8px;border-radius:10px;font-weight:900;font-size:15px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35);
 background:linear-gradient(#e9b64f,#c58a1d);box-shadow:0 3px 0 #8a5e0d}
.day i{display:block;margin-top:4px;height:34px;border-radius:6px;font-style:normal;color:#8a4a00;text-shadow:none;line-height:34px;
 background:linear-gradient(45deg,#fff4c9 25%,#ffe08a 25% 50%,#fff4c9 50% 75%,#ffe08a 75%);background-size:14px 14px}
.day.now{background:linear-gradient(#7fe05f,#2f9d27);box-shadow:0 3px 0 #1c6b17}
.day.past{filter:grayscale(.7);opacity:.7}
.day.last{grid-column:2}
.big{font-size:18px;font-weight:900;padding:12px 40px;border:0;border-radius:26px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.3);
 background:linear-gradient(#59c6ff,#1678d8);box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 5px 0 #0c4a92,0 9px 12px rgba(0,0,0,.35)}
.big:active{transform:translateY(3px)}
.msg{font-size:20px;font-weight:900;margin:8px 0 14px}
#toast{position:fixed;left:50%;top:44%;transform:translateX(-50%);padding:9px 18px;border-radius:20px;background:rgba(40,25,10,.9);font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:80}
#toast.on{opacity:1}
.praise{position:fixed;left:50%;top:36%;font-size:46px;font-weight:900;white-space:nowrap;color:#ffd23f;-webkit-text-stroke:2px #b3541a;
 text-shadow:0 5px 0 #7a3a10,0 10px 14px rgba(0,0,0,.5);pointer-events:none;z-index:25;animation:pr 1.2s ease-out forwards}
@keyframes pr{0%{transform:translate(-50%,-50%) scale(.3) rotate(-8deg);opacity:0}22%{transform:translate(-50%,-50%) scale(1.25) rotate(3deg);opacity:1}65%{transform:translate(-50%,-55%) scale(1) rotate(0);opacity:1}100%{transform:translate(-50%,-110%) scale(1);opacity:0}}
.shake{animation:sk .3s}@keyframes sk{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

.dot{position:absolute;top:-4px;right:-4px;width:15px;height:15px;border-radius:50%;background:#ff3b30;border:2px solid #fff;display:none}
.dot.on{display:block}
.side{position:absolute;top:8px;width:76px;text-align:center;font-size:12px;font-weight:800;text-shadow:0 2px 0 rgba(0,0,0,.45);z-index:2}
#bonusb{left:6px}#dailyb{right:6px}
.ic{position:relative;width:56px;height:56px;font-size:28px;display:grid;place-items:center;margin:0 auto 2px}
.ic b{position:absolute;bottom:-5px;right:-5px;min-width:22px;height:22px;border-radius:11px;background:#e9506b;border:2px solid #fff;font-size:12px;line-height:18px;padding:0 4px}
.pulse{animation:pl .5s}@keyframes pl{50%{transform:scale(1.3)}}
#slots{position:absolute;left:0;right:0;bottom:20px;display:flex;justify-content:center;gap:7px}
.slot{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;font-size:19px;
 background:repeating-linear-gradient(45deg,#cbbba9 0 4px,#bba99a 4px 8px);box-shadow:inset 0 2px 4px rgba(0,0,0,.25)}
.slot.on{background:linear-gradient(#fffdf6,#f3e6c8);outline:2px solid #9a5a2b;outline-offset:-1px;box-shadow:0 3px 0 #8a5226;color:var(--o2);font-weight:900}
.slot.st{font-size:17px}
#panel.nostar{padding-bottom:18px}
.fly{position:fixed;z-index:40;padding:5px 14px;border-radius:12px;font-weight:900;font-size:22px;letter-spacing:2px;color:var(--o2);background:linear-gradient(#fffdf6,#f3e6c8);border:3px solid #fff;outline:2px solid #9a5a2b;outline-offset:-1px;box-shadow:0 4px 0 #8a5226;pointer-events:none}
.coinfx{position:fixed;z-index:40;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#fff3a6,#f6b91f 55%,#c47d08);border:2px solid #fff0a0;color:#a15d00;font-weight:900;font-size:14px;pointer-events:none}
#cur.ok{background:linear-gradient(#58d963,#1f9a2c);box-shadow:inset 0 2px 0 rgba(255,255,255,.35),0 3px 0 #135f1b,0 6px 8px rgba(0,0,0,.4)}
#ov.win{background:rgba(0,0,0,.62)}
.burst{position:absolute;left:50%;top:50%;width:620px;height:620px;margin:-310px 0 0 -310px;border-radius:50%;
 background:repeating-conic-gradient(rgba(255,240,170,.6) 0 8deg,transparent 8deg 20deg);
 -webkit-mask-image:radial-gradient(circle,#000 0,transparent 66%);mask-image:radial-gradient(circle,#000 0,transparent 66%);animation:spin 16s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.done{position:relative;text-align:center}
.done .ribbon{display:inline-block;font-size:24px;padding:12px 30px;margin-bottom:18px;animation:pop .5s}
.done .msg{text-shadow:0 3px 0 rgba(0,0,0,.45)}
@media (max-width:380px){.done .ribbon{font-size:19px;padding:10px 22px}}
.green{background:linear-gradient(#7fe05f,#2f9d27)!important;box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 5px 0 #1c6b17,0 9px 12px rgba(0,0,0,.35)!important}
.red{background:linear-gradient(#ff8a7a,#d63a2a)!important;box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 5px 0 #8e1d12!important}
.stack .big{display:block;width:100%;margin:0 0 12px;font-size:16px;padding:11px 10px}
.tbox{background:#e3dfc8;color:#1f7d85;font-weight:800;padding:9px;border-radius:6px;border:1px solid #cfc8a8;font-size:16px;margin:0 6px 10px}
.illu{position:relative;font-size:92px;line-height:1.15;height:120px}
.illu .bub{position:absolute;left:8px;top:0;font-size:40px;line-height:1.2;background:#fff;border-radius:10px;padding:2px 8px;box-shadow:0 2px 5px rgba(0,0,0,.25)}
.paper p{color:#7a3d12;font-weight:800;font-size:15px;text-align:left;margin:8px 8px 10px;line-height:1.35}
.dots{margin-top:6px}.dots i{display:inline-block;width:16px;height:16px;border-radius:50%;background:#c7742c;margin:0 5px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}
.dots i.on{background:radial-gradient(circle at 35% 30%,#ffe27a,#e5a300)}
.arr{position:absolute;top:50%;width:34px;height:58px;margin-top:-29px;border:0;background:#f8efd2;font-size:26px;color:#c7742c;font-weight:900;box-shadow:0 3px 6px rgba(0,0,0,.3);z-index:3}
.arr.l{left:-14px;border-radius:0 14px 14px 0}.arr.r{right:-14px;border-radius:14px 0 0 14px}
.ex{display:flex;align-items:center;justify-content:center;gap:6px;margin:10px 0}
.t{display:grid;place-items:center;width:50px;height:50px;border-radius:8px;background:#b4a191;font-size:30px;font-weight:900;color:var(--o2);border:3px solid #2fb83a;-webkit-text-stroke:1px #ffe0bd}
.ex.no .t{border-color:#e03030}
.ex .mk{font-size:46px;font-weight:900;margin-left:8px;color:#2fb83a;-webkit-text-stroke:0}.ex.no .mk{color:#e03030}
.bar{position:relative;height:16px;margin:30px 16px 16px;background:#1c2b5a;border-radius:8px;box-shadow:inset 0 2px 4px rgba(0,0,0,.5)}
.bar .fill{height:100%;border-radius:8px;background:linear-gradient(#7fe05f,#2f9d27)}
.bar b{position:absolute;top:-16px;transform:translateX(-50%);font-size:26px}
.bw{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 4px}
.inf{flex:0 0 auto;align-self:center;display:grid;place-items:center;width:var(--ib,24px);height:var(--ib,24px);margin-left:2px;padding:0;border:2px solid #fff;border-radius:50%;
 background:linear-gradient(#59c6ff,#1678d8);color:#fff;font:italic 900 calc(var(--ib,24px)*.62)/1 Georgia,serif;box-shadow:0 3px 0 #0c4a92,0 5px 6px rgba(0,0,0,.3)}
.inf:active{transform:translateY(2px)}
.info .nom{font-size:30px;font-weight:900;color:var(--o2);-webkit-text-stroke:1px #ffe0bd;text-shadow:0 3px 0 #b9541a;margin:2px 0 12px}
.info .lig{background:#e3dfc8;border-radius:8px;padding:8px 10px;margin:8px 4px;text-align:left;font-size:15px;font-weight:700;color:#7a3d12;line-height:1.35}
.credit{font-size:11px;font-weight:600;line-height:1.3;color:#7a3d12;opacity:.8;margin-top:2px}
.info .src{font-weight:600;font-size:12px;opacity:.75}
.info .lig b{display:block;font-size:12px;letter-spacing:.5px;text-transform:uppercase;color:#1f7d85;margin-bottom:2px}
.bw .word{gap:2px}.bw .cell{width:24px;height:24px;font-size:15px}

body.home #top,body.home #bottom{display:none}
body:not(.home) #home{display:none}
#home,#splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;overflow:hidden;
 background:radial-gradient(ellipse 60% 22% at 50% 0%,rgba(255,255,225,.65),transparent 70%),
  radial-gradient(ellipse at 50% 50%,transparent 50%,rgba(0,45,50,.38) 100%),
  linear-gradient(90deg,rgba(255,255,255,.2) 50%,transparent 50%),linear-gradient(rgba(255,255,255,.2) 50%,transparent 50%),#2a8f96;
 background-size:auto,auto,118px 118px,118px 118px,auto}
#home{z-index:40}
#splash{z-index:60;transition:opacity .45s}#splash.out{opacity:0;pointer-events:none}

.logo .o{text-shadow:-3px -3px 0 #6b1d10,3px -3px 0 #6b1d10,-3px 3px 0 #6b1d10,3px 3px 0 #6b1d10,0 6px 0 #4a1008,0 11px 12px rgba(0,0,0,.4)}
.l1{font-size:clamp(34px,11.5vw,50px);color:#f7894a;letter-spacing:1px}

 outline:3px dashed rgba(255,225,190,.6);outline-offset:-8px;box-shadow:0 6px 0 #4a1008,0 12px 16px rgba(0,0,0,.4)}
.spool{position:absolute;right:-6px;bottom:-14px;font-size:44px;transform:rotate(-12deg);filter:drop-shadow(0 4px 4px rgba(0,0,0,.4))}
.charg{position:absolute;left:50%;bottom:21%;transform:translateX(-50%);white-space:nowrap;font-weight:900;font-size:clamp(34px,10.5vw,48px);color:#ef4b66;
 font-family:"Trebuchet MS",system-ui,sans-serif;text-shadow:-3px -3px 0 #ffeacc,3px -3px 0 #ffeacc,-3px 3px 0 #ffeacc,3px 3px 0 #ffeacc,0 5px 0 #c9a97d,0 9px 10px rgba(0,0,0,.3)}

 background:linear-gradient(var(--g1),var(--g2)) padding-box,linear-gradient(#f0c07a,#9a5d2a) border-box;box-shadow:0 5px 0 #5d3414,0 11px 16px rgba(0,0,0,.35);text-shadow:0 2px 0 rgba(0,0,0,.25)}

 <div id="bar">

 <div id="cur"></div>
 <div id="wheel"><svg id="svg"><polyline id="l1" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
 <div class="side" id="bonusb"><button class="wood ic">🧺<b id="bcnt">0</b></button>Mots-Bonus</div>
 <div class="side" id="dailyb"><button class="wood ic">📅<i class="dot" id="ddot"></i></button>Défi du jour</div>
 <div class="act" id="shuf"><button class="wood">🔄</button>Mélanger</div>
 <div class="act" id="hint"><button class="wood">💡</button>Indice <span class="cost"><span class="coin">$</span>60</span></div>
</div>
<div id="home">
 <div id="hcoins"><span class="coin">$</span><span id="hcoinn">0</span><button id="hplus">+</button></div>
 <div class="logo"><div class="l1 o">Champion</div><div class="l2 o">des noms</div><div class="l3 o">Bibliques</div><span class="spool">🧵</span></div>
 <div class="btns">
  <button class="pill green" id="play"><span class="ico">▶</span>Jouer</button>
  <button class="pill blue" id="hdaily"><span class="ico">📅</span>Défi du jour<i class="dot" id="hddot"></i></button>
 </div>
 <div class="hrow">
  <div class="it" id="hshop"><button class="wood">🛒</button>Boutique</div>
  <div class="it" id="hmsg"><button class="wood">✉️<i class="dot" id="hmdot"></i></button>Message</div>
  <div class="it" id="hset"><button class="wood">⚙</button>Paramètres</div>
 </div>
</div>
<div id="splash">
 <div class="logo"><div class="l1 o">Champion</div><div class="l2 o">des noms</div><div class="l3 o">Bibliques</div><span class="spool">🧵</span></div>
 <div class="charg">Chargement<span id="dots">.</span></div>
</div>
<div id="ov"></div><div id="toast"></div>
<script>
let starWord=null,starFound=false;
let LV=[],NI={},n=1,mode='m',dIdx=0,L,found=new Set(),bset=new Set(),H={},coins=300,path=[],drag=false,done=false,mute=false;
const $=id=>document.getElementById(id);
const sget=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}};
const sset=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const today=()=>new Date().toISOString().slice(0,10);
const cur=()=>mode==='d'?LV[dIdx]:LV[n-1];
const tag=()=>mode==='d'?'d'+today():String(n);
/* ---------- sons ---------- */
let AC=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,t0,d,type,v){const a=ac();if(!a||mute)return;const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+t0;
 o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+d);
 o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.05);}
const GAMME=[0,2,4,5,7,9,11,12];
const sfx={
 tick(i){tone(440*Math.pow(2,GAMME[Math.min(i,7)]/12),0,.12,'triangle',.16)},
 ok(len){[523,659,784,1047,1319].slice(0,Math.max(3,Math.min(5,len))).forEach((f,i)=>tone(f,i*.08,.28,'sine',.2));tone(1568,.4,.35,'triangle',.1)},
 bad(){tone(190,0,.16,'sawtooth',.1);tone(140,.12,.22,'sawtooth',.1)},
 coin(){tone(988,0,.1,'square',.08);tone(1319,.09,.28,'square',.08)},
 bonus(){[784,988,1175,1568].forEach((f,i)=>tone(f,i*.07,.22,'square',.07))},
 win(){[523,659,784,1047,1319,1568].forEach((f,i)=>tone(f,i*.1,.4,'triangle',.2))}
};
const PR=['Cool !','Super !','Bien !','Génial !','Excellent !','Formidable !','Magnifique !','Parfait !','Incroyable !','Fantastique !'];
let lastPr=-1;
function praise(len,txt){let lo=len>=6?6:len>=4?3:0,hi=len>=6?10:len>=4?7:4,i=0;
 if(!txt){do{i=lo+Math.floor(Math.random()*(hi-lo))}while(i===lastPr&&hi-lo>1);lastPr=i;}
 const e=document.createElement('div');e.className='praise';e.textContent=txt||PR[i];document.body.appendChild(e);setTimeout(()=>e.remove(),1250);}
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1900);}
function setCoins(v){coins=v;sset('nb-coins',v);$('coinn').textContent=v;$('hcoinn').textContent=v;}
function show(html,cls){$('ov').className=cls||'';$('ov').innerHTML=html;$('ov').style.display='flex';}
function hide(){$('ov').style.display='none';$('ov').innerHTML='';}
/* ---------- chargement ---------- */
mute=sget('nb-mute',false);
let loaded=false;const t0=Date.now();let dn=0;
setInterval(()=>{dn=(dn+1)%4;$('dots').textContent='.'.repeat(dn+1);},350);
function endSplash(){if(!loaded||Date.now()-t0<1800){setTimeout(endSplash,150);return;}
 $('splash').classList.add('out');setTimeout(()=>{$('splash').style.display='none';},500);upd();setCoins(coins);daily();}
setTimeout(endSplash,150);
fetch('noms.json').then(r=>r.json()).then(o=>{NI=o;grid();}).catch(()=>{});
fetch('levels.json').then(r=>r.json()).then(a=>{LV=a;coins=sget('nb-coins',300);setCoins(coins);
 n=Math.min(Math.max(1,sget('nb-lvl',1)),LV.length);dIdx=100+(Math.floor(Date.now()/864e5)*37)%600;load();loaded=true;});
function load(){const v=cur();L={l:[...v.l],w:v.w,b:v.b||[]};const t=tag();
 found=new Set(sget('nb-f-'+t,[]));bset=new Set(sget('nb-b-'+t,[]));H=sget('nb-h-'+t,{});done=false;
 starWord=(mode==='m'&&starLevel(Math.floor((n-1)/10))===n)?starWordOf(n):null;starFound=!!sget('nb-s-'+t,false);
 $('lvl').textContent=mode==='d'?'Défi du jour':'Niveau '+n;
 upd();
 slots();grid();wheel();badge();check(true);
 if(mode==='m'&&n===5&&!sget('nb-ht',0)&&!document.body.classList.contains('home')){sset('nb-ht',1);setTimeout(()=>howto(0),500);}}
function grid(pop){const t=L.w.reduce((a,w)=>a+w.length,0);
 setC(t<=12?46:t<=24?38:t<=40?31:27);
 $('grid').innerHTML=L.w.map(w=>'<div class="word">'+[...w].map((c,i)=>{
  const f=found.has(w),h=(H[w]||0)>i;
  return '<div class="cell'+(f?' on':h?' hint':'')+(pop===w?' pop':'')+'">'+(f||h?c:'')+'</div>';}).join('')+(found.has(w)?'<button class="inf" data-w="'+w+'">i</button>':'')+'</div>').join('');fit();}
function setC(c){const g=$('grid');g.style.setProperty('--c',c+'px');g.style.setProperty('--ib',Math.max(18,Math.round(c*.62))+'px');}
function fit(){const g=$('grid');let c=parseInt(g.style.getPropertyValue('--c'))||40;
 const cs=getComputedStyle($('panel'));const avail=Math.max(80,innerHeight*.36-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom)-4);
 while(g.offsetHeight>avail&&c>16){c-=2;setC(c);}}
function starLevel(dec){const r=(Math.imul(dec+7,2654435761)>>>0)%10;
 for(let k=0;k<10;k++){const i=dec*10+((r+k)%10)+1;if(i<3||i>LV.length)continue;if(LV[i-1].b.length)return i;}return 0;}
function starWordOf(i){return LV[i-1].b.slice().sort((x,y)=>y.length-x.length||x.localeCompare(y))[0];}
function slots(){const s=$('slots'),pn=$('panel');
 if(!starWord){pn.classList.add('nostar');s.innerHTML='';return;}
 pn.classList.remove('nostar');
 s.innerHTML=[...starWord].map((c,i)=>starFound?'<div class="slot on">'+c+'</div>':'<div class="slot st">'+(i===0?'⭐':'')+'</div>').join('');}
const MED=[5,12,20],MR=[20,40,80];
function badge(){$('bcnt').textContent=sget('nb-bc',0);}
/* ---------- roue ---------- */
function wheel(){const W=$('wheel');W.querySelectorAll('.let').forEach(e=>e.remove());
 const s=W.clientWidth,k=L.l.length,R=s*(k>6?.355:.335),d=s*(k<=5?.21:k==6?.19:.165);
 L.l.forEach((c,i)=>{const a=-Math.PI/2+i*2*Math.PI/k,x=s/2+R*Math.cos(a),y=s/2+R*Math.sin(a),e=document.createElement('div');
  e.className='let';e.textContent=c;e.style.cssText='left:'+x+'px;top:'+y+'px;width:'+d*1.4+'px;height:'+d*1.4+'px;font-size:'+d*1.15+'px';
  e.dataset.x=x;e.dataset.y=y;W.appendChild(e);});}
const valid=w=>w.length>1&&((L.w.includes(w)&&!found.has(w))||(L.b.includes(w)&&!bset.has(w)));
function draw(x,y){const p=path.map(e=>e.dataset.x+','+e.dataset.y);if(x!=null)p.push(x+','+y);
 const w=path.map(e=>e.textContent).join(''),ok=valid(w);
 $('l1').setAttribute('points',p.join(' '));$('l1').setAttribute('stroke',ok?'#34d24a':'#fff');
 $('svg').style.filter='drop-shadow(0 0 6px '+(ok?'#6dff82':'rgba(255,255,255,.8)')+')';
 $('cur').textContent=w;$('cur').classList.toggle('ok',ok);$('cur').style.visibility=w?'visible':'hidden';
 document.querySelectorAll('.let').forEach(e=>e.classList.toggle('sel',path.includes(e)));}
function pos(ev){const r=$('wheel').getBoundingClientRect();return [ev.clientX-r.left,ev.clientY-r.top];}
function hit(ev){const e=document.elementFromPoint(ev.clientX,ev.clientY);return e&&e.classList.contains('let')?e:null;}
$('wheel').addEventListener('pointerdown',ev=>{ac();if(done)return;const e=hit(ev);if(!e)return;drag=true;path=[e];sfx.tick(0);const[x,y]=pos(ev);draw(x,y);});
window.addEventListener('pointermove',ev=>{if(!drag)return;const e=hit(ev);
 if(e){if(path.length>1&&e===path[path.length-2])path.pop();else if(!path.includes(e)){path.push(e);sfx.tick(path.length-1);}}
 const[x,y]=pos(ev);draw(x,y);});
window.addEventListener('pointerup',()=>{if(!drag)return;drag=false;const w=path.map(e=>e.textContent).join('');
 if(L.w.includes(w)&&!found.has(w)){found.add(w);sset('nb-f-'+tag(),[...found]);grid(w);if(navigator.vibrate)navigator.vibrate(25);sfx.ok(w.length);if(found.size<L.w.length)praise(w.length);check();}
 else if(L.b.includes(w)&&!bset.has(w))bonusFound(w);
 else if(w.length>1){sfx.bad();if(found.has(w)||bset.has(w))toast('Vous avez déjà trouvé ce mot');$('wheel').classList.add('shake');setTimeout(()=>$('wheel').classList.remove('shake'),300);}
 path=[];draw(null);$('cur').style.visibility='hidden';});
function fly(w){const a=$('cur').getBoundingClientRect(),b=$('bonusb').getBoundingClientRect(),e=document.createElement('div');
 const x0=a.left+a.width/2,y0=a.top+a.height/2,dx=b.left+b.width/2-x0,dy=b.top+b.height/2-y0;
 e.className='fly';e.textContent=w;e.style.left=x0+'px';e.style.top=y0+'px';document.body.appendChild(e);
 e.animate([{transform:'translate(-50%,-50%) scale(1)',opacity:1},
  {transform:'translate(calc(-50% + '+dx*.5+'px),calc(-50% + '+(dy*.5-70)+'px)) scale(1.15)',opacity:1,offset:.4},
  {transform:'translate(calc(-50% + '+dx+'px),calc(-50% + '+dy+'px)) scale(.25)',opacity:.3}],{duration:800,easing:'ease-in'})
 .onfinish=()=>{e.remove();const k=$('bonusb').firstChild;k.classList.add('pulse');setTimeout(()=>k.classList.remove('pulse'),500);};}
function coinBurst(){const r=$('slots').getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2;
 for(let i=0;i<12;i++){const e=document.createElement('div');e.className='coinfx';e.textContent='$';e.style.left=x+'px';e.style.top=y+'px';document.body.appendChild(e);
  const a=Math.PI*2*i/12,d=70+Math.random()*60,cx=Math.cos(a)*d,cy=Math.sin(a)*d;
  e.animate([{transform:'translate(-50%,-50%) scale(.4)',opacity:1},
   {transform:'translate(calc(-50% + '+cx+'px),calc(-50% + '+(cy-40)+'px)) scale(1)',opacity:1,offset:.6},
   {transform:'translate(calc(-50% + '+cx+'px),calc(-50% + '+(cy+60)+'px)) scale(.8)',opacity:0}],{duration:1000,easing:'ease-out'}).onfinish=()=>e.remove();}}
function bonusFound(w){bset.add(w);sset('nb-b-'+tag(),[...bset]);sfx.bonus();fly(w);
 let c=sget('nb-bc',0)+1,gain=0;const i=MED.indexOf(c);if(i>=0)gain=MR[i];
 if(c>=MED[2])c=0;sset('nb-bc',c);badge();
 if(w===starWord&&!starFound){starFound=true;sset('nb-s-'+tag(),true);slots();coinBurst();gain+=50;setTimeout(()=>{sfx.win();praise(9,'Mot étoilé !');},450);}
 if(gain){setCoins(coins+gain);setTimeout(()=>{sfx.coin();toast('Récompense : +'+gain+' pièces');},900);}}
/* ---------- boutons ---------- */
$('shuf').onclick=()=>{L.l.sort(()=>Math.random()-.5);wheel();};
$('hint').onclick=()=>{if(done)return;if(coins<60)return toast('Pas assez de pièces');
 const c=L.w.filter(w=>!found.has(w)&&(H[w]||0)<w.length-1);if(!c.length)return toast('Plus d’indice possible');
 const w=c[Math.floor(Math.random()*c.length)];H[w]=(H[w]||0)+1;sset('nb-h-'+tag(),H);setCoins(coins-60);sfx.coin();grid();};
$('plus').onclick=()=>toast('Gagne des pièces en réussissant les niveaux');
$('bonusb').onclick=()=>{const c=sget('nb-bc',0),pc=Math.min(100,c/MED[2]*100);
 const starRow=(starWord&&!starFound)?'<div class="word" style="width:100%;justify-content:center">'+[...starWord].map(()=>'<div class="cell on" style="background:#27407d;border-color:#27407d;outline-color:#fff">⭐</div>').join('')+'</div>':'';
 const tiles=[...bset].map(w=>'<div class="word">'+[...w].map(x=>'<div class="cell on">'+x+'</div>').join('')+'<button class="inf" data-w="'+w+'">i</button></div>').join('')||'<p style="text-align:center">Aucun mot bonus trouvé dans ce niveau.</p>';
 show('<div class="card"><div class="ribbon">Mots Bonus</div><button class="wood x" id="cl">✕</button><div class="paper"><div class="bar"><div class="fill" style="width:'+pc+'%"></div><b style="left:25%">🥉</b><b style="left:60%">🥈</b><b style="left:96%">🥇</b></div><div class="msg" style="font-size:15px;margin:4px 0">'+c+' / '+MED[2]+'</div><div class="bw">'+starRow+tiles+'</div><p style="text-align:center">Trouve des noms qui ne sont pas dans les réponses pour gagner des pièces !</p></div></div>');};
$('dailyb').onclick=()=>{if(sget('nb-dcd','')===today())return toast('Défi du jour déjà terminé. Reviens demain !');
 mode='d';hide();load();toast('Défi du jour : +50 pièces à la clé');};
/* ---------- victoire ---------- */
function check(silent){if(!L||found.size!==L.w.length||done)return;if(silent&&document.body.classList.contains('home'))return;done=true;const t=tag(),first=!sget('nb-w-'+t,false);let gain=0;
 if(first){gain=mode==='d'?50:10;sset('nb-w-'+t,true);setCoins(coins+gain);if(mode==='d')sset('nb-dcd',today());$('ddot').classList.remove('on');if(!silent){sfx.win();praise(9,'Génial !');}}
 setTimeout(()=>show('<div class="burst"></div><div class="done"><div class="ribbon">'+(mode==='d'?'DÉFI RÉUSSI !':'NIVEAU TERMINÉ !')+'</div>'+(gain?'<div class="msg">+'+gain+' <span class="coin" style="vertical-align:middle">$</span></div>':'')+'<button class="big green" id="nx">'+(mode==='d'?'Continuer':'Niveau suivant')+'</button></div>','win'),silent?100:600);}
/* ---------- fiche d'un nom ---------- */
function info(w){const d=NI[w]||{n:w.charAt(0)+w.slice(1).toLowerCase()};
 show('<div class="card info"><div class="ribbon">Infos</div><button class="wood x" id="cl">✕</button><div class="paper"><div class="nom">'+d.n+'</div>'
 +(d.t?'<div class="lig"><b>Nature</b>'+d.t+'</div>':'')
 +'<div class="lig"><b>Sens du nom</b>'+(d.s||'Sens non renseigné pour l’instant.')+(d.l?'<span class="src"> (d’après le lexique de Tyndale House)</span>':'')+'</div>'
 +'<div class="lig"><b>Où le trouver</b>'+(d.r?'Premier passage : '+d.r:'Verset non renseigné.')+'</div></div></div>');}
/* ---------- tutoriel ---------- */
const TILES=w=>[...w].map(c=>'<span class="t">'+c+'</span>').join('');
function howto(p){const pg=p===0
 ?'<div class="tbox">Trouvez des mots supplémentaires !</div><div class="illu"><span class="bub">🪙</span>🧺</div><p>Quelques noms plus difficiles qui ne sont pas dans les réponses.<br>Utilisez le kit de couture pour collecter plus de récompenses !</p>'
 :'<div class="tbox">Trouvez des mots supplémentaires !</div><div class="ex">'+TILES('LÉA')+'<span class="mk">✔</span></div><div class="ex no">'+TILES('ALÉ')+'<span class="mk">✘</span></div><p>Les mots suivants seront exclus :<br>- mots de 2 lettres<br>- noms avec préfixes ou suffixes<br>- mots offensants</p>';
 show('<div class="card"><div class="ribbon">Comment jouer</div><button class="wood x" id="cl">✕</button>'+(p?'<button class="arr l" id="hp">‹</button>':'<button class="arr r" id="hn">›</button>')+'<div class="paper">'+pg+'<div class="dots"><i class="'+(p?'':'on')+'"></i><i class="'+(p?'on':'')+'"></i></div></div></div>');}
/* ---------- réglages & clics ---------- */
document.addEventListener('click',e=>{const id=e.target.id;
 if(e.target.classList.contains('inf')){info(e.target.dataset.w);return;}
 if(id==='nx'){hide();if(mode==='d'){mode='m';load();}else if(n<LV.length){n++;sset('nb-lvl',n);load();}else toast('🏆 Tu es le champion !');}
 if(id==='cl'||e.target.classList.contains('x'))hide();
 if(id==='hn')howto(1);if(id==='hp')howto(0);
 if(id==='ht')howto(0);
 if(id==='bk'){hide();mode='m';load();}
 if(id==='hm'){hide();goHome();}
 if(id==='wl'){setCoins(coins+100);sset('nb-welcome',true);sfx.coin();hide();upd();toast('+100 pièces');}
 if(id==='rs'&&confirm('Tout recommencer ?')){try{localStorage.clear()}catch(x){}location.reload();}
 if(id==='sn'){mute=!mute;sset('nb-mute',mute);e.target.textContent=mute?'🔇 Son : coupé':'🔊 Son : activé';if(!mute)sfx.coin();}});
function upd(){const nd=sget('nb-dcd','')!==today();$('ddot').classList.toggle('on',nd);$('hddot').classList.toggle('on',nd);$('hmdot').classList.toggle('on',!sget('nb-welcome',false));}
function settings(){const g=!document.body.classList.contains('home');
 show('<div class="card"><div class="ribbon">'+(g?'Réglages':'Paramètres')+'</div><button class="wood x" id="cl">✕</button><div class="paper stack">'
 +(g?'<div class="msg" style="font-size:16px">'+(mode==='d'?'Défi du jour':'Niveau '+n+' / '+LV.length)+'</div>':'')
 +'<button class="big" id="sn">'+(mute?'🔇 Son : coupé':'🔊 Son : activé')+'</button><button class="big" id="ht">❓ Comment jouer</button>'
 +(g?'<button class="big" id="hm">🏠 Menu principal</button>':'')
 +(g&&mode==='d'?'<button class="big green" id="bk">Retour au niveau '+n+'</button>':'')
 +'<button class="big red" id="rs">Recommencer</button><div class="credit">Sens et nature des noms : données STEPBible.org (Tyndale House), licence CC BY 4.0, traduites en français.</div></div></div>');}
$('gear').onclick=settings;$('hset').onclick=settings;
function goHome(){document.body.classList.add('home');upd();setCoins(coins);}
function goGame(m){mode=m;document.body.classList.remove('home');load();}
$('play').onclick=()=>{ac();goGame('m');};
$('hdaily').onclick=()=>{ac();if(sget('nb-dcd','')===today())return toast('Défi du jour déjà terminé. Reviens demain !');goGame('d');toast('Défi du jour : +50 pièces à la clé');};
$('hplus').onclick=()=>show('<div class="card"><div class="ribbon">Boutique</div><button class="wood x" id="cl">✕</button><div class="paper"><div class="shopnote">Gagne des pièces en réussissant les niveaux, en trouvant les mots bonus et le mot étoilé, et avec le bonus quotidien.</div></div></div>');
$('hshop').onclick=()=>show('<div class="card"><div class="ribbon">Boutique</div><button class="wood x" id="cl">✕</button><div class="paper"><div class="msg">🛒</div><div class="shopnote">La boutique arrive bientôt.<br>En attendant, gagne des pièces en jouant : tu en as '+coins+'.</div></div></div>');
$('hmsg').onclick=()=>{const w=sget('nb-welcome',false);
 show('<div class="card"><div class="ribbon">Messages</div><button class="wood x" id="cl">✕</button><div class="paper">'
 +(w?'<div class="shopnote">Aucun nouveau message.</div>':'<div class="msgbox">🎁 <b>Bienvenue, Champion !</b><br>Voici 100 pièces pour bien commencer ta partie.</div><button class="big" id="wl">Collecter</button>')
 +'</div></div>');};
/* ---------- bonus quotidien ---------- */
const RW=[25,35,45,55,65,75,90];
function daily(){const s=sget('nb-daily',{last:'',day:0}),t=today();if(s.last===t)return;
 const y=new Date(Date.now()-864e5).toISOString().slice(0,10),day=s.last===y?(s.day%7)+1:1;
 const cards=RW.map((v,i)=>'<div class="day'+(i+1===day?' now':i+1<day?' past':'')+(i===6?' last':'')+'">'+(i+1===day?'Aujourd’hui':'Jour '+(i+1))+'<i><span class="coin" style="width:22px;height:22px;font-size:12px;vertical-align:middle">$</span> '+v+'</i></div>').join('');
 show('<div class="card"><div class="ribbon">Bonus quotidien</div><button class="wood x" id="cl">✕</button><div class="paper"><div class="msg" style="font-size:15px">N’oublie pas le bonus quotidien !</div><div class="days">'+cards+'</div><button class="big" id="col">Collecter</button></div></div>');
 $('col').onclick=()=>{ac();sfx.coin();setCoins(coins+RW[day-1]);sset('nb-daily',{last:t,day});hide();toast('+'+RW[day-1]+' pièces');};}
window.addEventListener('resize',()=>{if(L){grid();wheel();}});
